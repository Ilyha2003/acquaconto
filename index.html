<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AcquaConto</title>
<meta name="description" content="Dividi la bolletta dell'acqua per lettura contatore.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" id="theme-color-meta" content="#eef3f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AcquaConto">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#eef3f5;
    --surface:#ffffff;
    --surface-2:#f6f9fb;
    --ink:#12222c;
    --muted:#5d6f7a;
    --faint:#8aa0ab;
    --line:#dde7ec;
    --line-strong:#c8d6dd;
    --accent:#0a7ea4;
    --accent-ink:#075d78;
    --accent-soft:#dcedf3;
    --good:#12996a;
    --good-soft:#d7f0e5;
    --warn:#c0492b;
    --warn-soft:#f7e2dc;
    --shadow:0 1px 2px rgba(18,34,44,.05),0 8px 24px rgba(18,34,44,.06);
    --radius:14px;
    --radius-sm:10px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#0d151d;
      --surface:#152029;
      --surface-2:#1b2a35;
      --ink:#e7eef2;
      --muted:#97abb6;
      --faint:#677d89;
      --line:#243642;
      --line-strong:#33485a;
      --accent:#41badd;
      --accent-ink:#8fd8ee;
      --accent-soft:#123443;
      --good:#38c88b;
      --good-soft:#123a2c;
      --warn:#f08262;
      --warn-soft:#3d211a;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d151d;
    --surface:#152029;
    --surface-2:#1b2a35;
    --ink:#e7eef2;
    --muted:#97abb6;
    --faint:#677d89;
    --line:#243642;
    --line-strong:#33485a;
    --accent:#41badd;
    --accent-ink:#8fd8ee;
    --accent-soft:#123443;
    --good:#38c88b;
    --good-soft:#123a2c;
    --warn:#f08262;
    --warn-soft:#3d211a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:no-preference){
    header,body,.card,.person,.tile,.tile.refund,.btn,.add,.seg,.seg button,.icon-btn,.input-affix,.meter .mrow,.badge,.person__name,.conso,.conso b,.amount,.tile .k,.tile .v,.tile .sub,.basis__lbl,.sec-head h2,.sec-head .count,.brand p,details.panel,details.panel>summary,.panel-body,.hist-item,.hist-item>summary .date,.foot,input,textarea,.field label,.meter span,.input-affix .aff,.meter .u{
      transition:background-color .5s ease,border-color .5s ease,color .5s ease,fill .5s ease;
    }
    .brand__mark{transition:color .5s ease}
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px));transition:opacity .2s ease}

  /* header */
  header{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    margin:calc(-18px - env(safe-area-inset-top,0px)) -16px 14px;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;
    background:var(--bg);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .brand__mark{width:34px;height:34px;flex:none;color:var(--accent)}
  .brand h1{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:700;font-size:1.42rem;line-height:1.05;margin:0;letter-spacing:-.02em;
    text-wrap:balance;
  }
  .brand p{margin:2px 0 0;font-size:.8rem;color:var(--muted)}
  .hdr-controls{display:flex;flex-direction:row;align-items:stretch;gap:8px}
  .seg{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
  .seg button{
    border:0;background:transparent;color:var(--muted);cursor:pointer;
    font:600 .72rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.04em;
    padding:6px 11px;border-radius:999px;
  }
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .icon-btn{
    width:34px;height:34px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;
  }
  .icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}

  /* cards */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .stack{display:flex;flex-direction:column;gap:14px}

  /* bill inputs */
  .bill{padding:14px}
  .bill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .input-affix{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-sm);overflow:hidden}
  .input-affix:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .input-affix .aff{padding:0 9px;color:var(--faint);font:500 .9rem/1 "IBM Plex Mono",monospace;flex:none}
  .input-affix input{
    width:100%;border:0;background:transparent;color:var(--ink);
    font:600 1.02rem/1 "IBM Plex Mono",monospace;padding:11px 10px 11px 0;text-align:right;
  }
  .input-affix input:focus{outline:none}
  .aff.right{border-left:0;padding-left:0;padding-right:10px}

  /* section label */
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 0}
  .sec-head h2{font:600 .74rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
  .sec-head .count{font:500 .74rem/1 "IBM Plex Mono",monospace;color:var(--faint)}

  /* people */
  .people{display:flex;flex-direction:column;gap:10px}
  .person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 11px;box-shadow:var(--shadow)}
  .person.warn{border-color:var(--warn);background:linear-gradient(0deg,var(--warn-soft),transparent 60%)}
  .person__top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .person__name{
    flex:1;min-width:0;border:0;background:transparent;color:var(--ink);
    font:600 1.02rem/1.2 "IBM Plex Sans",sans-serif;padding:4px 4px;border-radius:8px;
  }
  .person__name:hover{background:var(--surface-2)}
  .person__name:focus{outline:none;background:var(--surface-2);box-shadow:0 0 0 2px var(--accent-soft)}
  .badge{font:600 .62rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px;flex:none}
  .badge.you{background:var(--accent-soft);color:var(--accent-ink)}
  .badge.absent{background:var(--surface-2);color:var(--faint);border:1px solid var(--line)}
  .badge.check{background:var(--warn-soft);color:var(--warn)}
  .del{width:28px;height:28px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--faint);cursor:pointer;display:grid;place-items:center}
  .del:hover{color:var(--warn);border-color:var(--warn)}
  .person__meters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
  .meter{display:flex;flex-direction:column;gap:4px}
  .meter span{font-size:.66rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
  .meter .mrow{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:9px}
  .meter .mrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .meter input{width:100%;border:0;background:transparent;color:var(--ink);font:600 .98rem/1 "IBM Plex Mono",monospace;padding:9px 4px 9px 10px;text-align:right}
  .meter input:focus{outline:none}
  .meter .u{padding:0 9px 0 3px;color:var(--faint);font:500 .78rem/1 "IBM Plex Mono",monospace}
  .person__result{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .conso{font:500 .84rem/1 "IBM Plex Mono",monospace;color:var(--muted)}
  .conso b{color:var(--ink);font-weight:600}
  .amount{margin-left:auto;font:600 1.12rem/1 "IBM Plex Mono",monospace;color:var(--ink);font-variant-numeric:tabular-nums}
  .amount.zero{color:var(--faint)}
  .send{
    border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;
    font:600 .78rem/1 "IBM Plex Sans",sans-serif;padding:8px 13px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;
  }
  .send:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
  .send svg{width:14px;height:14px}
  .send[hidden]{display:none}

  .add{
    align-self:flex-start;border:1px dashed var(--line-strong);background:transparent;color:var(--muted);cursor:pointer;
    font:600 .82rem/1 "IBM Plex Sans",sans-serif;padding:11px 14px;border-radius:11px;display:inline-flex;align-items:center;gap:7px;width:100%;justify-content:center;
  }
  .add:hover{color:var(--accent);border-color:var(--accent)}

  /* results */
  .results{padding:15px 14px 16px;background:linear-gradient(180deg,var(--surface),var(--surface-2))}
  .basis{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .basis__lbl{font:600 .7rem/1.2 "IBM Plex Sans",sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .seg.small{margin-left:auto}
  .seg.small button{padding:6px 12px;font-size:.74rem}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:5px}
  .tile .k{font-size:.64rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .tile .v{font:600 1.16rem/1 "IBM Plex Mono",monospace;color:var(--ink);font-variant-numeric:tabular-nums}
  .tile .sub{font:500 .66rem/1 "IBM Plex Mono",monospace;color:var(--faint)}
  .tile.refund{background:var(--good-soft);border-color:transparent}
  .tile.refund .k{color:var(--good)}
  .tile.refund .v{color:var(--good)}
  .balance{display:flex;align-items:center;gap:10px;margin-top:12px;font:500 .78rem/1.3 "IBM Plex Sans",sans-serif;color:var(--muted)}
  .bar{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden;position:relative}
  .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px}
  .balance b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}

  /* actions */
  .actions{display:grid;grid-template-columns:1fr;gap:9px}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:600 .86rem/1 "IBM Plex Sans",sans-serif;padding:13px 14px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .btn:hover{border-color:var(--line-strong)}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-ink)}
  .btn.ghost{padding:13px 12px}

  /* collapsibles */
  details.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  details.panel>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:9px;font:600 .84rem/1 "IBM Plex Sans",sans-serif;color:var(--ink)}
  details.panel>summary::-webkit-details-marker{display:none}
  details.panel>summary .chev{margin-left:auto;color:var(--faint);transition:transform .18s ease}
  details.panel[open]>summary .chev{transform:rotate(90deg)}
  .panel-body{padding:0 15px 15px;border-top:1px solid var(--line)}

  .hist-item{border:1px solid var(--line);border-radius:11px;margin-top:11px;background:var(--surface-2);overflow:hidden}
  .hist-item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 12px}
  .hist-item>summary::-webkit-details-marker{display:none}
  .hist-item>summary .date{font:600 .86rem/1.2 "IBM Plex Sans",sans-serif;color:var(--ink);text-transform:capitalize}
  .hist-item>summary .rfd{margin-left:auto;font:600 .8rem/1 "IBM Plex Mono",monospace;color:var(--good);background:var(--good-soft);padding:5px 8px;border-radius:8px}
  .hist-item>summary .chev{color:var(--faint);transition:transform .18s ease;flex:none}
  .hist-item[open]>summary .chev{transform:rotate(90deg)}
  .hist-detail{padding:0 12px 12px}
  .hist-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 .74rem/1.5 "IBM Plex Sans",sans-serif;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
  .hist-meta b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
  .hist-rows{margin-top:4px;display:flex;flex-direction:column}
  .hist-row2{display:grid;grid-template-columns:1fr auto;gap:1px 10px;padding:7px 0;border-top:1px dashed var(--line)}
  .hist-row2 .nm{font:600 .84rem/1.3 "IBM Plex Sans",sans-serif;color:var(--ink)}
  .hist-row2 .a{font:600 .86rem/1.3 "IBM Plex Mono",monospace;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  .hist-row2 .calc{grid-column:1/-1;font:500 .74rem/1.3 "IBM Plex Mono",monospace;color:var(--muted)}
  .hist-row2 .calc b{color:var(--ink)}
  .hist-row2 .tag{display:inline-block;font:600 .6rem/1 "IBM Plex Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);background:var(--surface);border:1px solid var(--line);padding:3px 6px;border-radius:6px}
  .hist-del{margin-top:11px;border:1px solid var(--line);background:transparent;color:var(--faint);cursor:pointer;font:600 .74rem/1 "IBM Plex Sans",sans-serif;padding:8px 11px;border-radius:8px}
  .hist-del:hover{color:var(--warn);border-color:var(--warn)}
  .empty{color:var(--faint);font-size:.84rem;padding:12px 2px;text-align:center}

  .hint{font-size:.74rem;color:var(--faint);margin:9px 2px 0;line-height:1.5}

  /* toast */
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font:600 .82rem/1 "IBM Plex Sans",sans-serif;padding:12px 18px;border-radius:999px;box-shadow:var(--shadow);transition:opacity .22s ease,transform .22s ease;z-index:50;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .foot{text-align:center;color:var(--faint);font-size:.72rem;margin-top:22px;line-height:1.6}

  @media (max-width:420px){
    .actions{grid-template-columns:1fr 1fr}
    .btn.primary{grid-column:1 / -1}
    .tiles{gap:7px}
    .tile{padding:10px}
    .tile .v{font-size:1.02rem}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2.5C12 2.5 5 10 5 15a7 7 0 0 0 14 0c0-5-7-12.5-7-12.5Z" fill="currentColor" opacity=".16"/>
        <path d="M12 2.5C12 2.5 5 10 5 15a7 7 0 0 0 14 0c0-5-7-12.5-7-12.5Z" stroke="currentColor" stroke-width="1.6"/>
        <path d="M9 15.2a3 3 0 0 0 3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>AcquaConto</h1>
        <p data-t="subtitle"></p>
      </div>
    </div>
    <div class="hdr-controls">
      <div class="seg" role="group" aria-label="Language">
        <button id="lang-en" onclick="setLang('en')">EN</button>
        <button id="lang-it" onclick="setLang('it')">IT</button>
      </div>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Theme">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="stack">
    <div class="card bill">
      <div class="bill-grid">
        <div class="field">
          <label data-t="billLabel"></label>
          <div class="input-affix">
            <span class="aff">€</span>
            <input id="bill" inputmode="decimal" placeholder="0,00" oninput="onBill(this)">
          </div>
        </div>
        <div class="field">
          <label data-t="estLabel"></label>
          <div class="input-affix">
            <input id="est" inputmode="decimal" placeholder="0" oninput="onEst(this)" style="text-align:right;padding-left:10px">
            <span class="aff right">m³</span>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="sec-head">
        <h2 data-t="peopleLabel"></h2>
        <span class="count" id="peopleCount"></span>
      </div>
      <div class="people" id="people" style="margin-top:9px"></div>
      <button class="add" onclick="addPerson()" style="margin-top:10px">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        <span data-t="addPerson"></span>
      </button>
    </div>

    <div class="card results">
      <div class="basis">
        <span class="basis__lbl" data-t="basisLabel"></span>
        <div class="seg small" role="group" aria-label="basis">
          <button id="basis-real" onclick="setBasis('real')" data-t="basisReal"></button>
          <button id="basis-est" onclick="setBasis('estimated')" data-t="basisEst"></button>
        </div>
      </div>
      <div class="tiles">
        <div class="tile"><span class="k" data-t="priceLabel"></span><span class="v" id="rPrice">—</span><span class="sub" id="rPriceSub"></span></div>
        <div class="tile"><span class="k" data-t="collectedLabel"></span><span class="v" id="rCollected">—</span><span class="sub" id="rRealSub"></span></div>
        <div class="tile refund"><span class="k" data-t="refundLabel"></span><span class="v" id="rRefund">—</span><span class="sub" data-t="fromCompany"></span></div>
      </div>
      <div class="balance">
        <span data-t="realWord"></span> <b id="bReal">0</b> m³
        <div class="bar"><i id="bFill" style="width:0%"></i></div>
        <span data-t="estWord"></span> <b id="bEst">0</b> m³
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" onclick="saveMonth()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13H5z" stroke-linejoin="round"/><path d="M8 4v5h7M8 20v-6h8v6" stroke-linejoin="round"/></svg>
        <span data-t="saveMonth"></span>
      </button>
    </div>

    <details class="panel" id="histPanel">
      <summary>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2" stroke-linecap="round"/></svg>
        <span data-t="historyBtn"></span>
        <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="panel-body" id="histBody"></div>
    </details>

    <p class="foot" data-t="foot"></p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- i18n ---------- */
const T = {
  en:{
    subtitle:"Split the bill by meter reading",
    billLabel:"Bill amount",
    estLabel:"Estimated consumption",
    peopleLabel:"People",
    addPerson:"Add person",
    priceLabel:"Price / m³",
    basisLabel:"Price based on",
    basisReal:"Real ÷",
    basisEst:"Est. ÷",
    collectedLabel:"Collected",
    refundLabel:"Your refund",
    fromCompany:"from company",
    realWord:"Real",
    estWord:"Est.",
    saveMonth:"Save month",
    historyBtn:"History",
    prev:"Previous",
    curr:"Current",
    you:"You",
    absent:"Absent",
    check:"Check reading",
    send:"Send",
    name:"Name",
    usedWord:"used",
    savedToast:"Month saved",
    copiedToast:"Copied to clipboard",
    needBill:"Enter a bill amount and estimated m³ first",
    deletedToast:"Removed",
    delMonthConfirm:"Delete this saved month?",
    deleteWord:"Delete month",
    noHistory:"No saved months yet.",
    shareMsg:(n,c,p,a)=>`Hi ${n}, your share of the bill: ${c} m³ × €${p}/m³ = €${a}.`,
    foot:"Everything is saved on this device."
  },
  it:{
    subtitle:"Dividi la bolletta per lettura contatore",
    billLabel:"Importo bolletta",
    estLabel:"Consumo stimato",
    peopleLabel:"Persone",
    addPerson:"Aggiungi persona",
    priceLabel:"Prezzo / m³",
    basisLabel:"Prezzo basato su",
    basisReal:"Reale ÷",
    basisEst:"Stim. ÷",
    collectedLabel:"Incassato",
    refundLabel:"Tuo rimborso",
    fromCompany:"dall'azienda",
    realWord:"Reale",
    estWord:"Stim.",
    saveMonth:"Salva mese",
    historyBtn:"Storico",
    prev:"Precedente",
    curr:"Attuale",
    you:"Tu",
    absent:"Assente",
    check:"Verifica lettura",
    send:"Invia",
    name:"Nome",
    usedWord:"consumo",
    savedToast:"Mese salvato",
    copiedToast:"Copiato negli appunti",
    needBill:"Inserisci prima importo e m³ stimati",
    deletedToast:"Rimosso",
    delMonthConfirm:"Eliminare questo mese salvato?",
    deleteWord:"Elimina mese",
    noHistory:"Nessun mese salvato.",
    shareMsg:(n,c,p,a)=>`Ciao ${n}, la tua quota della bolletta: ${c} m³ × €${p}/m³ = €${a}.`,
    foot:"Tutto è salvato su questo dispositivo."
  }
};

/* ---------- state ---------- */
const LS_KEY = "acquaConto.v1";
let lang = "it";
let state = null;

function seed(){
  return {
    lang:"it",
    langChosen:false,
    theme:"light",
    themeChosen:false,
    people:[
      {id:"mhamed", name:"Mhamed", fixed:true, prima:"0"}
    ],
    basis:"real",
    draft:{ bill:"", estimated:"", readings:{mhamed:""} },
    history:[]
  };
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.people) return s; }
  }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

/* ---------- helpers ---------- */
const uid = ()=> "p"+Math.random().toString(36).slice(2,8);
function parseNum(v){ if(v==null) return 0; const n = parseFloat(String(v).replace(",",".")); return isNaN(n)?0:n; }
function locale(){ return lang==="it" ? "it-IT" : "en-US"; }
function money(n){ return n.toLocaleString(locale(),{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(n){ return Number.isInteger(n) ? n.toLocaleString(locale()) : n.toLocaleString(locale(),{minimumFractionDigits:0,maximumFractionDigits:2}); }
function price(n){ return n.toLocaleString(locale(),{minimumFractionDigits:2,maximumFractionDigits:4}); }

/* ---------- compute ---------- */
function computeAll(){
  const bill = parseNum(state.draft.bill);
  const est  = parseNum(state.draft.estimated);
  const basis = state.basis || "real";
  let real = 0;
  const base = state.people.map(p=>{
    const prima = parseNum(p.prima);
    const adesso = parseNum(state.draft.readings[p.id]);
    const absent = !(adesso>0);
    const conso = absent ? 0 : (adesso - prima);
    const warn = (!absent && conso<0);
    const eff = conso>0 ? conso : 0;
    real += eff;
    return {p, prima, adesso, absent, conso, warn, eff};
  });
  const divisor = basis==="estimated" ? est : real;
  const unit = divisor>0 ? bill/divisor : 0;
  const rows = base.map(r=>({...r, amount:r.eff*unit}));
  const collected = real*unit;
  const estRate = est>0 ? bill/est : 0;
  const refund = Math.max(0, est - real) * estRate;
  return {bill, est, basis, unit, real, collected, refund, rows};
}

/* ---------- render ---------- */
function applyStaticText(){
  document.querySelectorAll("[data-t]").forEach(el=>{
    const k = el.getAttribute("data-t");
    const val = T[lang][k];
    if(typeof val === "string") el.textContent = val;
  });
  document.getElementById("lang-en").setAttribute("aria-pressed", lang==="en");
  document.getElementById("lang-it").setAttribute("aria-pressed", lang==="it");
  document.getElementById("bill").value = state.draft.bill ? String(state.draft.bill).replace(".",",") : "";
  document.getElementById("est").value  = state.draft.estimated || "";
}

function renderPeople(){
  const host = document.getElementById("people");
  host.innerHTML = "";
  state.people.forEach(p=>{
    const card = document.createElement("div");
    card.className = "person";
    card.dataset.id = p.id;
    card.innerHTML = `
      <div class="person__top">
        <input class="person__name" value="${escapeAttr(p.name)}" placeholder="${T[lang].name}" data-field="name" aria-label="${T[lang].name}">
        ${p.fixed ? `<span class="badge you">${T[lang].you}</span>` : ""}
        <span class="badge absent" data-role="absent" hidden>${T[lang].absent}</span>
        <span class="badge check" data-role="check" hidden>${T[lang].check}</span>
        ${p.fixed ? "" : `<button class="del" title="remove" aria-label="remove"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}
      </div>
      <div class="person__meters">
        <label class="meter"><span>${T[lang].prev}</span><div class="mrow"><input inputmode="decimal" data-field="prima" value="${escapeAttr(p.prima)}"><span class="u">m³</span></div></label>
        <label class="meter"><span>${T[lang].curr}</span><div class="mrow"><input inputmode="decimal" data-field="adesso" value="${escapeAttr(state.draft.readings[p.id]||"")}"><span class="u">m³</span></div></label>
      </div>
      <div class="person__result">
        <span class="conso" data-role="conso"></span>
        <span class="amount" data-role="amount">—</span>
        <button class="send" data-role="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 12l16-7-7 16-2-6-7-3Z" stroke-linejoin="round"/></svg>${T[lang].send}</button>
      </div>`;
    card.querySelector('[data-field="name"]').addEventListener("input", e=>{ p.name=e.target.value; save(); });
    card.querySelector('[data-field="prima"]').addEventListener("input", e=>{ p.prima=e.target.value; recompute(); save(); });
    card.querySelector('[data-field="adesso"]').addEventListener("input", e=>{ state.draft.readings[p.id]=e.target.value; recompute(); save(); });
    const del = card.querySelector(".del");
    if(del) del.addEventListener("click", ()=>removePerson(p.id));
    card.querySelector('[data-role="send"]').addEventListener("click", ()=>sendTo(p.id));
    host.appendChild(card);
  });
  document.getElementById("peopleCount").textContent = state.people.length;
  recompute();
}

function recompute(){
  const c = computeAll();
  c.rows.forEach(r=>{
    const card = document.querySelector(`.person[data-id="${r.p.id}"]`);
    if(!card) return;
    card.classList.toggle("warn", r.warn);
    const absentBadge = card.querySelector('[data-role="absent"]');
    const checkBadge = card.querySelector('[data-role="check"]');
    absentBadge.hidden = !(r.absent);
    checkBadge.hidden = !r.warn;
    const conso = card.querySelector('[data-role="conso"]');
    const amount = card.querySelector('[data-role="amount"]');
    const send = card.querySelector('[data-role="send"]');
    if(r.warn){
      conso.innerHTML = `<b>${num(r.conso)}</b> m³`;
    }else{
      conso.innerHTML = `<b>${num(r.conso)}</b> m³ ${T[lang].usedWord}`;
    }
    amount.textContent = "€"+money(r.amount);
    amount.classList.toggle("zero", !(r.amount>0));
    send.hidden = !(r.amount>0);
  });
  document.getElementById("rPrice").textContent    = c.unit>0 ? "€"+price(c.unit) : "—";
  document.getElementById("rPriceSub").textContent = "÷ "+num(c.basis==="estimated"?c.est:c.real)+" m³";
  document.getElementById("rCollected").textContent= "€"+money(c.collected);
  document.getElementById("rRefund").textContent   = "€"+money(c.refund);
  document.getElementById("rRealSub").textContent  = num(c.real)+" m³";
  document.getElementById("basis-real").setAttribute("aria-pressed", c.basis==="real");
  document.getElementById("basis-est").setAttribute("aria-pressed", c.basis==="estimated");
  document.getElementById("bReal").textContent = num(c.real);
  document.getElementById("bEst").textContent  = num(c.est);
  const pct = c.est>0 ? Math.max(0,Math.min(100, (c.real/c.est)*100)) : 0;
  document.getElementById("bFill").style.width = pct+"%";
}

function escapeAttr(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

/* ---------- people actions ---------- */
function addPerson(){
  const id = uid();
  state.people.push({id, name:"", fixed:false, prima:"0"});
  state.draft.readings[id]="";
  save(); renderPeople();
  const el = document.querySelector(`.person[data-id="${id}"] .person__name`);
  if(el) el.focus();
}
function removePerson(id){
  const p = state.people.find(x=>x.id===id);
  if(!p || p.fixed) return;
  state.people = state.people.filter(x=>x.id!==id);
  delete state.draft.readings[id];
  save(); renderPeople(); toast(T[lang].deletedToast);
}

/* ---------- send ---------- */
function sendTo(id){
  const c = computeAll();
  const r = c.rows.find(x=>x.p.id===id);
  if(!r || !(r.amount>0)) return;
  const msg = T[lang].shareMsg(r.p.name || T[lang].name, num(r.conso), price(c.unit), money(r.amount));
  if(navigator.share){
    navigator.share({text:msg}).catch(()=>{});
  }else if(navigator.clipboard){
    navigator.clipboard.writeText(msg).then(()=>toast(T[lang].copiedToast)).catch(()=>toast(msg));
  }else{
    toast(msg);
  }
}

/* ---------- save month ---------- */
function saveMonth(){
  const c = computeAll();
  if(!(c.bill>0) || !(c.est>0)){ toast(T[lang].needBill); return; }
  const entry = {
    id: uid(), savedAt: Date.now(), basis:c.basis,
    bill:c.bill, est:c.est, unit:c.unit, real:c.real, collected:c.collected, refund:c.refund,
    rows: c.rows.map(r=>({name:r.p.name, prima:r.prima, adesso:r.adesso, conso:r.conso, amount:r.amount, absent:r.absent}))
  };
  state.history.unshift(entry);
  state.people.forEach(p=>{
    const adesso = parseNum(state.draft.readings[p.id]);
    if(adesso>0) p.prima = String(adesso);
    state.draft.readings[p.id]="";
  });
  state.draft.bill=""; state.draft.estimated="";
  save();
  applyStaticText(); renderPeople(); renderHistory();
  toast(T[lang].savedToast);
}

/* ---------- history ---------- */
function renderHistory(){
  const body = document.getElementById("histBody");
  if(!state.history.length){ body.innerHTML = `<p class="empty">${T[lang].noHistory}</p>`; return; }
  body.innerHTML = state.history.map(h=>{
    const d = new Date(h.savedAt);
    const dateStr = d.toLocaleDateString(locale(),{year:"numeric",month:"long",day:"numeric"});
    const rows = h.rows.map(r=>{
      const calc = r.absent
        ? `<span class="tag">${T[lang].absent}</span>`
        : `${num(r.prima)} → ${num(r.adesso)} = <b>${num(r.conso)}</b> m³`;
      return `<div class="hist-row2">
        <span class="nm">${escapeAttr(r.name)}</span>
        <span class="a">€${money(r.amount)}</span>
        <span class="calc">${calc}</span>
      </div>`;
    }).join("");
    return `<details class="hist-item">
      <summary>
        <span class="date">${dateStr}</span>
        <span class="rfd" title="${T[lang].refundLabel}">+€${money(h.refund)}</span>
        <svg class="chev" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="hist-detail">
        <div class="hist-meta">
          <span>${T[lang].billLabel}: <b>€${money(h.bill)}</b></span>
          <span>${T[lang].priceLabel} <b>€${price(h.unit)}</b></span>
          <span>${T[lang].realWord} <b>${num(h.real)}</b> / ${T[lang].estWord} <b>${num(h.est)}</b> m³</span>
          <span>${T[lang].collectedLabel}: <b>€${money(h.collected)}</b></span>
        </div>
        <div class="hist-rows">${rows}</div>
        <button class="hist-del" onclick="delMonth('${h.id}')">${T[lang].deleteWord}</button>
      </div>
    </details>`;
  }).join("");
}
function delMonth(id){
  if(!confirm(T[lang].delMonthConfirm)) return;
  state.history = state.history.filter(h=>h.id!==id);
  save(); renderHistory();
}

/* ---------- lang / theme ---------- */
function setLang(l){
  lang=l; state.lang=l; state.langChosen=true; save();
  const w=document.querySelector(".wrap");
  if(!w || window.matchMedia("(prefers-reduced-motion:reduce)").matches){ renderAll(); return; }
  w.style.opacity="0.3";
  setTimeout(()=>{ renderAll(); w.style.opacity="1"; }, 180);
}
function setBasis(b){ state.basis=b; save(); recompute(); }
function updateThemeColor(){
  const el = document.documentElement.getAttribute("data-theme");
  const dark = el==="dark" || (!el && window.matchMedia("(prefers-color-scheme: dark)").matches);
  const m = document.getElementById("theme-color-meta");
  if(m) m.setAttribute("content", dark ? "#0d151d" : "#eef3f5");
}
function applyTheme(){
  if(state.theme==="dark") document.documentElement.setAttribute("data-theme","dark");
  else if(state.theme==="light") document.documentElement.setAttribute("data-theme","light");
  else document.documentElement.removeAttribute("data-theme");
  updateThemeColor();
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur==="dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
  state.theme = isDark ? "light" : "dark";
  state.themeChosen = true;
  applyTheme(); save();
}

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2400);
}

/* ---------- input handlers ---------- */
function onBill(el){ state.draft.bill = el.value.replace(",","."); recompute(); save(); }
function onEst(el){ state.draft.estimated = el.value; recompute(); save(); }

/* ---------- boot ---------- */
function renderAll(){ applyStaticText(); renderPeople(); renderHistory(); }
function init(){
  state = load();
  if(!state.langChosen) state.lang = "it";
  if(!state.themeChosen) state.theme = "light";   // default to light until the user picks a theme
  lang = state.lang || "it";
  applyTheme();
  renderAll();
  try{
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if(!state.theme) updateThemeColor(); });
  }catch(e){}
}
init();

/* ---------- service worker (offline) ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
